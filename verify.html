<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate Verification | PSG College of Arts &amp; Science</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      font-family: "Open Sans", Arial, sans-serif;
      background: #f5f3ee; color: #222;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 20px; color: #2e2f94; }
    header p { margin: 4px 0 0; font-size: 13px; color: #666; }
    .card {
      background: #fff; border: 1px solid #ddd; border-top: 5px solid #a68547;
      border-radius: 8px; padding: 24px;
    }
    .status { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
    .ok { color: #1b7f3b; }
    .bad { color: #b3261e; }
    dl { margin: 0; }
    dt { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-top: 14px; }
    dd { margin: 2px 0 0; font-size: 16px; }
    .name { font-size: 22px; font-weight: 700; }
    footer { text-align: center; margin-top: 20px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PSG College of Arts &amp; Science, Coimbatore</h1>
      <p>Certificate Verification</p>
    </header>

    <div class="card" id="card">
      <p class="status" id="status">Verifying...</p>
      <dl id="details"></dl>
    </div>

    <footer>Issued by the Career Development Center</footer>
  </div>

  <script>
    // >>> PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) <<<
    const API_URL = "https://script.google.com/macros/s/AKfycbxXGqC7LPbfqeFBRbahb0MFcwuxS0lsV0pIri89sMh4jkWQ8BL95VAg7BL_RRvsiI0W/exec";

    const statusEl = document.getElementById("status");
    const detailsEl = document.getElementById("details");

    function addRow(label, value, extraClass) {
      if (!value) return;
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = value;
      if (extraClass) dd.className = extraClass;
      detailsEl.append(dt, dd);
    }

    function showInvalid(msg) {
      statusEl.textContent = msg || "Certificate not found or no longer valid";
      statusEl.className = "status bad";
    }

    async function verify() {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { showInvalid("No certificate ID provided"); return; }

      try {
        const res = await fetch(API_URL + "?id=" + encodeURIComponent(id));
        const data = await res.json();

        if (!data.valid) { showInvalid(); return; }

        statusEl.textContent = "\u2713 Valid certificate";
        statusEl.className = "status ok";
        addRow("Presented to", data.name, "name");
        addRow("Event", data.event);
        addRow("Company", data.company);
        addRow("Date", data.date);
        addRow("Department", data.department);
        addRow("Batch", data.batch);
        addRow("Certificate ID", data.certificateId);
        addRow("Issued by", data.issuedBy);
      } catch (err) {
        showInvalid("Could not verify right now. Please try again.");
      }
    }

    verify();
  </script>
</body>
</html>
